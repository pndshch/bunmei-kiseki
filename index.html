#scene{position:relative;flex:1;min-height:0;overflow:hidden;transition:background 3s ease}

.stat-icon{font-size:12px;width:18px;text-align:center;flex-shrink:0}

.stat-bar{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.stat-fill{height:100%;border-radius:3px;transition:width .6s ease;width:0}
.food-fill{background:linear-gradient(90deg,#cc6600,#daa520)}
.safety-fill{background:linear-gradient(90deg,#3366aa,#5588cc)}
.conv-fill{background:linear-gradient(90deg,#338888,#44aaaa)}
.comfort-fill{background:linear-gradient(90deg,#7744aa,#9966cc)}
.meaning-fill{background:linear-gradient(90deg,#e8a030,#ffcc44)}
.crisis-fill{background:linear-gradient(90deg,#a23b32,#d9685f)}
.boredom-fill{background:linear-gradient(90deg,#555566,#777788)}
.stat-val{width:34px;text-align:right;font-family:system-ui,sans-serif;font-size:10px;color:#7d8590;font-variant-numeric:tabular-nums}

#bottom-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
#pop-display{font-size:12px;color:#8b949e;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums}

#era-desc{font-size:12px;color:#7d8590;line-height:1.5;min-height:34px}

.overlay{position:fixed;inset:0;background:rgba(5,8,12,.92);display:flex;align-items:center;justify-content:center;z-index:100;opacity:1;transition:opacity .8s ease}

.overlay-inner{text-align:center;padding:24px;max-width:390px}

.intro-sub{font-size:14px;color:#8b949e;margin-bottom:16px;font-family:system-ui,sans-serif;letter-spacing:1px}
.intro-desc{font-size:13px;color:#7d8590;line-height:1.8;margin-bottom:20px}
.overlay-btn{background:linear-gradient(135deg,#238636,#2ea043);border:none;color:#fff;font:600 14px/1 system-ui,sans-serif;padding:13px 30px;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:.5px}

.overlay-btn:active{transform:scale(.97)}
.end-btn{background:linear-gradient(135deg,#3a3a44,#4a4a55)}

/* choice overlay */
#choice{position:fixed;inset:0;background:linear-gradient(180deg,rgba(7,9,14,.8) 0%,rgba(7,9,14,.87) 48%,rgba(6,8,12,1) 82%);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s ease}
#choice.show{opacity:1;pointer-events:auto}
.choice-card{width:min(94vw,420px);max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,rgba(21,25,33,.99),rgba(13,16,22,.99));border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.65);transform:translateY(20px) scale(.97);transition:transform .4s cubic-bezier(.2,.85,.25,1)}

.choice-era{font-weight:700;letter-spacing:1.5px}
.choice-num{color:#6d7680;font-variant-numeric:tabular-nums}
.choice-title{font-size:21px;font-weight:700;line-height:1.4;margin-bottom:9px;letter-spacing:.5px}
.choice-situation{font-size:13.5px;color:#9aa4b0;line-height:1.75;margin-bottom:17px}
.choice-opts{display:flex;flex-direction:column;gap:9px}

.opt-btn:hover{background:rgba(124,58,237,.14);border-color:rgba(124,58,237,.55)}
.opt-btn:active{transform:scale(.99)}
.opt-label{font-size:14px;color:#e6edf3;line-height:1.55}
.opt-hints{display:flex;flex-wrap:wrap;gap:5px}
.hint{font-family:system-ui,sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.3px;white-space:nowrap}
.hint-good{background:rgba(63,160,110,.16);color:#5cc492}
.hint-bad{background:rgba(200,80,72,.18);color:#e27d72}

#ending .overlay-inner>*{opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
#ending.show .overlay-inner>*{opacity:1;transform:translateY(0)}
#ending.show .overlay-inner>*:nth-child(1){transition-delay:0s}
#ending.show .overlay-inner>*:nth-child(2){transition-delay:.3s}
#ending.show .overlay-inner>*:nth-child(3){transition-delay:.6s}
#ending.show .overlay-inner>*:nth-child(4){transition-delay:.9s}
#ending.show .overlay-inner>*:nth-child(5){transition-delay:1.2s}
#ending.show .overlay-inner>*:nth-child(6){transition-delay:1.5s}
#ending.show .overlay-inner>*:nth-child(7){transition-delay:1.8s}

.end-sub{font-size:15px;color:#8b949e;margin-bottom:14px;line-height:1.6}
.end-reflect{font-size:12px;color:#828c98;line-height:1.95;margin-bottom:12px}
.end-tracker{font-family:system-ui,sans-serif;font-size:11px;color:#6d7680;margin-bottom:18px}

#ending.ending-ruin h1{color:#e0726a}
#ending.ending-ruin .end-badge{background:rgba(200,70,60,.2);color:#e0726a;border:1px solid rgba(224,114,106,.4)}
#ending.ending-stagnation{background:radial-gradient(ellipse at 50% 38%,#241f16,#080807)}
#ending.ending-stagnation h1{color:#bcab8e}
#ending.ending-stagnation .end-badge{background:rgba(150,130,95,.18);color:#bcab8e;border:1px solid rgba(188,171,142,.38)}
#ending.ending-boredom{background:radial-gradient(ellipse at 50% 38%,#161a22,#07080a)}
#ending.ending-boredom h1{color:#9aa4b2}
#ending.ending-boredom .end-badge{background:rgba(120,132,150,.16);color:#9aa4b2;border:1px solid rgba(154,164,178,.34)}

#ending.ending-harmony .end-badge{background:rgba(140,160,90,.18);color:#c3d68f;border:1px solid rgba(195,214,143,.4)}

.fs-fill{height:100%;border-radius:3px;transition:width 1.4s ease}
.fs-val{width:32px;text-align:right;color:#7d8590;font-size:10px;font-variant-numeric:tabular-nums}

}

var $ = function(id){ return document.getElementById(id); };
var canvas = $('sim-canvas');
var ctx = canvas.getContext('2d');
var scene = $('scene');
var eraDots = document.querySelectorAll('.era-dot');

var lang = 'ja';
var year = 0;
var era = 0;
var speedIdx = 1;
var phase = 'intro';
var nextEvent = 0;
var currentEvent = 0;
var endingType = null;
var ruinTimer = 0;
var particles = [];
var lastTick = 0;
var boredom = 0;
var stats;

function freshStats(){ return {food:12, safety:8, convenience:5, comfort:3, meaning:75, crisis:6}; }
stats = freshStats();

var buildings = [];
(function(){
  for (var i = 0; i < 36; i++) {
    buildings.push({
      x: (i + .2 + Math.random() * .6) / 36,
      w: .006 + Math.random() * .016,
      maxH: .02 + Math.pow(Math.random(), 1.5) * .36,
      thr: Math.pow(Math.random(), 1.25) * .82
    });
  }
  buildings.sort(function(a,b){ return a.x - b.x; });
})();

function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
function matAvg(){ return (stats.food + stats.safety + stats.convenience + stats.comfort) / 4; }

function applyDrift(s, dy){
  var ma = (s.food + s.safety + s.convenience + s.comfort) / 4;
  s.food = clamp(s.food + dy * DRIFT_MAT * (1 - s.food / 100), 0, 100);
  s.safety = clamp(s.safety + dy * DRIFT_MAT * (1 - s.safety / 100), 0, 100);
  s.convenience = clamp(s.convenience + dy * DRIFT_MAT * (1 - s.convenience / 100), 0, 100);
  s.comfort = clamp(s.comfort + dy * DRIFT_MAT * (1 - s.comfort / 100), 0, 100);
  s.meaning = clamp(s.meaning - dy * DRIFT_MEAN * (ma / 100), 0, 100);
  s.crisis = clamp(s.crisis + dy * DRIFT_CRIS_UP * (s.convenience / 100) - dy * DRIFT_CRIS_DN, 0, 100);
}

function computeBoredom(){
  return clamp(matAvg() * (1 - stats.meaning / 100) * 1.15, 0, 100);
}

function deriveEra(){
  var m = matAvg();
  if (boredom > 52 && m > 62) return 5;
  if (m > 76) return 4;
  if (m > 56) return 3;
  if (m > 37) return 2;
  if (m > 19) return 1;
  return 0;
}

function targetPop(){
  return Math.floor(18 + stats.food / 100 * 175 + stats.safety / 100 * 115 + stats.comfort / 100 * 85);
}

function evaluateEnding(){
  if (stats.crisis >= RUIN_CRISIS_FINAL) return 'ruin';
  if (matAvg() < STAGNATION_MAT) return 'stagnation';
  if (stats.meaning >= HARMONY_MEANING) return 'harmony';
  return 'boredom';
}

var W = 0, H = 0, dpr = 1;
function resizeCanvas(){
  dpr = window.devicePixelRatio || 1;
  var r = scene.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function spawnParticle(){
  return {
    x: .1 + Math.random() * .8,
    y: .12 + Math.random() * .58,
    vx: (Math.random() - .5) * .002,
    vy: (Math.random() - .5) * .002,
    opacity: 1,
    size: 1.5 + Math.random(),
    thought: null,
    tTimer: Math.floor(Math.random() * 180),
    age: 0
  };
}

function updateParticle(p, e){
  p.age++;
  p.tTimer--;
  if (p.tTimer <= 0){
    var pool = ERA_THOUGHTS[e];
    p.thought = Math.random() < .22 ? pool[Math.floor(Math.random() * pool.length)] : null;
    p.tTimer = 100 + Math.floor(Math.random() * 140);
  }

  switch(e){
    case 0:
      p.vx += (Math.random() - .5) * .006;
      p.vy += (Math.random() - .5) * .006;
      if (Math.random() < .008){
        var fx = Math.random(), fy = .5 + Math.random() * .3;
        p.vx += (fx - p.x) * .015;
        p.vy += (fy - p.y) * .015;
      }
      break;
    case 1:
      var nearest = CLUSTERS[0], minD = 9;
      for (var ci = 0; ci < CLUSTERS.length; ci++){
        var dd = Math.hypot(p.x - CLUSTERS[ci][0], p.y - CLUSTERS[ci][1]);
        if (dd < minD){ minD = dd; nearest = CLUSTERS[ci]; }
      }
      p.vx += (nearest[0] - p.x) * .002;
      p.vy += (nearest[1] - p.y) * .002;
      p.vx += (Math.random() - .5) * .002;
      p.vy += (Math.random() - .5) * .002;
      break;
    case 2:
      var gx = Math.round(p.x * 10) / 10;
      var gy = Math.round(p.y * 8) / 8;
      p.vx += (gx - p.x) * .004;
      p.vy += (gy - p.y) * .004;
      p.vx += (Math.random() > .5 ? 1 : -1) * .0008;
      break;
    case 3:
      p.vx += (.5 - p.x) * .0008;
      p.vy += (.55 - p.y) * .0008;
      p.vx += (Math.random() - .5) * .0004;
      p.vy += (Math.random() - .5) * .0004;
      break;
    case 4:
      var dx4 = p.x - .5, dy4 = p.y - .5;
      var a4 = Math.atan2(dy4, dx4);
      p.vx += Math.cos(a4 + Math.PI / 2) * .0004;
      p.vy += Math.sin(a4 + Math.PI / 2) * .0004;
      p.vx += (.5 - p.x) * .0004;
      p.vy += (.5 - p.y) * .0004;
      p.vx += (Math.random() - .5) * .0006;
      p.vy += (Math.random() - .5) * .0006;
      break;
    case 5:
      p.vx *= .9;
      p.vy *= .9;
      if (Math.random() < .003){
        p.vx += (Math.random() - .5) * .002;
        p.vy += (Math.random() - .5) * .002;
      }
      p.opacity = clamp(.82 - boredom / 100 * .58, .18, .82);
      break;
  }

  var damp = e <= 1 ? .98 : .95;
  p.vx *= damp;
  p.vy *= damp;
  var spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  var maxSpd = e === 0 ? .006 : e <= 2 ? .004 : .002;
  if (spd > maxSpd){ p.vx *= maxSpd / spd; p.vy *= maxSpd / spd; }

  p.x += p.vx;
  p.y += p.vy;
  if (p.x < .02){ p.x = .02; p.vx = Math.abs(p.vx); }
  if (p.x > .98){ p.x = .98; p.vx = -Math.abs(p.vx); }
  if (p.y < .08){ p.y = .08; p.vy = Math.abs(p.vy); }
  if (p.y > .82){ p.y = .82; p.vy = -Math.abs(p.vy); }
}

function render(){
  ctx.clearRect(0, 0, W, H);
  if (W === 0) return;
  var e = era < 0 ? 0 : era;
  var groundH = H * .08;

  ctx.fillStyle = ERA_GROUND[e];
  ctx.fillRect(0, H - groundH, W, groundH);

  var cityLevel = (stats.convenience + stats.comfort) / 200;
  var bc = ERA_BLDG[e];
  for (var bi = 0; bi < buildings.length; bi++){
    var b = buildings[bi];
    if (cityLevel <= b.thr) continue;
    var prog = clamp((cityLevel - b.thr) / .42, 0, 1);
    var bh = b.maxH * prog * H;
    if (bh < 1) continue;
    var bx = b.x * W;
    var bw = Math.max(b.w * W, 2);
    ctx.fillStyle = bc;
    ctx.fillRect(bx, H - groundH - bh, bw, bh);
    if (bh > 15 && e >= 2){
      var nw = Math.floor(bh / 10);
      for (var wi = 0; wi < nw; wi++){
        if (Math.random() < .25){
          ctx.fillStyle = e >= 5 ? 'rgba(255,255,255,.06)' : e >= 4 ? 'rgba(200,180,255,.1)' : 'rgba(255,215,0,.12)';
          ctx.fillRect(bx + 1 + Math.random() * Math.max(0, bw - 3), H - groundH - bh + 3 + wi * 10, 1.5, 1.5);
        }
      }
    }
  }

  if (boredom > 55){
    var bp5 = clamp((boredom - 55) / 40, 0, 1);
    ctx.fillStyle = 'rgba(10,10,15,' + (bp5 * .32).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  var pc = ERA_PCOL[e];
  for (var pi = 0; pi < particles.length; pi++){
    var p = particles[pi];
    var px = p.x * W;
    var py = p.y * H;
    ctx.globalAlpha = p.opacity * .2;
    ctx.fillStyle = pc;
    ctx.beginPath();
    ctx.arc(px, py, p.size * 3, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = p.opacity * .85;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, 6.2832);
    ctx.fill();
    if (p.thought && p.thought !== ''){
      ctx.globalAlpha = p.opacity * .65;
      ctx.font = '11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(p.thought, px, py - p.size * 3 - 3);
    }
  }
  ctx.globalAlpha = 1;

  if (boredom > 58){
    var qp = clamp((boredom - 58) / 34, 0, 1);
    var qs = 40 + qp * 80;
    ctx.globalAlpha = qp * .13;
    ctx.font = qs + 'px serif';
    ctx.fillStyle = '#8888aa';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', W / 2, H * .4);
    ctx.globalAlpha = 1;
  }
}

function setBar(id, v){
  var p = Math.round(clamp(v, 0, 100));
  $('bar-' + id).style.width = p + '%';
  $('val-' + id).textContent = p + '%';
}

function applyEra(e){
  document.body.className = 'era-' + e;
  $('era-label').setAttribute('data-i18n', 'era' + e);
  $('era-label').textContent = I18N[lang]['era' + e];
  $('era-text').setAttribute('data-i18n', 'desc' + e);
  $('era-text').textContent = I18N[lang]['desc' + e];
  for (var di = 0; di < eraDots.length; di++){
    var cls = 'era-dot ec' + di;
    if (di === e) cls += ' active';
    else if (di < e) cls += ' past';
    eraDots[di].className = cls;
  }
}

function updateUI(e){
  setBar('food', stats.food);
  setBar('safety', stats.safety);
  setBar('conv', stats.convenience);
  setBar('comfort', stats.comfort);
  setBar('meaning', stats.meaning);
  setBar('crisis', stats.crisis);
  setBar('boredom', boredom);
  $('pop-count').textContent = particles.length;
  var y = Math.floor(year);
  $('year-display').textContent = lang === 'ja' ? y.toLocaleString() + ' 年' : 'Year ' + y.toLocaleString();
  if (e !== era){ era = e; applyEra(e); }
}

function tick(){
  var now = performance.now();

  if (phase === 'ruinanim'){
    lastTick = now;
    ruinTimer--;
    for (var i = particles.length - 1; i >= 0; i--){
      var rp = particles[i];
      rp.x += rp.vx; rp.y += rp.vy; rp.vy += .0007; rp.vx *= 1.004;
      rp.opacity -= .016;
      rp.thought = null;
      if (rp.opacity <= 0) particles.splice(i, 1);
    }
    render();
    if (ruinTimer <= 0) showEnding('ruin');
    return;
  }

  if (phase !== 'playing'){ return; }

  var dt = Math.min(now - lastTick, 100);
  lastTick = now;
  var dy = SPEEDS[speedIdx] * YEAR_PER_SEC * dt / 1000;
  year = Math.min(year + dy, END_YEAR);
  applyDrift(stats, dy);
  boredom = computeBoredom();
  var e = deriveEra();

  var target = targetPop();
  if (particles.length < target && Math.random() < .18) particles.push(spawnParticle());
  if (particles.length > target && Math.random() < .10) particles.splice((Math.random() * particles.length) | 0, 1);

  var deathRate = (1 - stats.safety / 100) * .0026 + (stats.crisis / 100) * .0022;
  for (var di = particles.length - 1; di >= 0; di--){
    if (Math.random() < deathRate) particles.splice(di, 1);
  }
  for (var pi = 0; pi < particles.length; pi++) updateParticle(particles[pi], e);

  render();
  updateUI(e);

  if (stats.crisis >= 100){ startRuin(); return; }
  if (nextEvent < EVENTS.length && year >= EVENTS[nextEvent].year){ openChoice(nextEvent); return; }
  if (year >= END_YEAR){ finalize(); }
}

function hintHTML(fx){
  var defs = [['food','sFood'],['safety','sSafety'],['convenience','sConv'],['comfort','sComfort'],['meaning','sMeaning'],['crisis','sCrisis']];
  var out = '';
  for (var i = 0; i < defs.length; i++){
    var v = fx[defs[i][0]];
    if (!v) continue;
    var big = Math.abs(v) >= 12;
    var ar = v > 0 ? (big ? '↑↑' : '↑') : (big ? '↓↓' : '↓');
    var bad = defs[i][0] === 'crisis' ? (v > 0) : (v < 0);
    out += '<span class="hint ' + (bad ? 'hint-bad' : 'hint-good') + '">' + I18N[lang][defs[i][1]] + ar + '</span>';
  }
  return out;
}

function renderChoice(idx){
  var ev = EVENTS[idx];
  var e = deriveEra();
  var optsHTML = '';
  for (var i = 0; i < ev.options.length; i++){
    var o = ev.options[i];
    optsHTML += '<button class="opt-btn" data-opt="' + i + '">' +
      '<span class="opt-label">' + o.label[lang] + '</span>' +
      '<span class="opt-hints">' + hintHTML(o.fx) + '</span></button>';
  }
  $('choice-card').innerHTML =
    '<div class="choice-meta">' +
      '<span class="choice-era" style="color:' + ERA_PCOL[e] + '">' + I18N[lang]['era' + e] + '</span>' +
      '<span class="choice-num">' + I18N[lang].crossroad + ' ' + (idx + 1) + ' / ' + EVENTS.length + '</span>' +
    '</div>' +
    '<h2 class="choice-title">' + ev.title[lang] + '</h2>' +
    '<p class="choice-situation">' + ev.situation[lang] + '</p>' +
    '<div class="choice-opts">' + optsHTML + '</div>';
}

function openChoice(idx){
  phase = 'choice';
  currentEvent = idx;
  renderChoice(idx);
  $('choice').classList.add('show');
}

function pickOption(optIdx){
  if (phase !== 'choice') return;
  var fx = EVENTS[currentEvent].options[optIdx].fx;
  for (var k in fx){ if (fx.hasOwnProperty(k)) stats[k] = clamp(stats[k] + fx[k], 0, 100); }
  nextEvent = currentEvent + 1;
  $('choice').classList.remove('show');
  boredom = computeBoredom();
  updateUI(deriveEra());
  if (stats.crisis >= 100){ startRuin(); return; }
  phase = 'playing';
  lastTick = performance.now();
}

function startRuin(){
  phase = 'ruinanim';
  ruinTimer = 72;
  lastTick = performance.now();
  $('choice').classList.remove('show');
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var ang = Math.random() * 6.2832;
    var spd = .006 + Math.random() * .015;
    p.vx = Math.cos(ang) * spd;
    p.vy = Math.sin(ang) * spd - .004;
  }
}

function finalize(){
  var t = evaluateEnding();
  if (t === 'ruin') startRuin();
  else showEnding(t);
}

function getFoundEndings(){
  try { return JSON.parse(localStorage.getItem('bk_endings') || '[]'); }
  catch (e){ return []; }
}
function recordEnding(type){
  try {
    var f = getFoundEndings();
    if (f.indexOf(type) < 0){ f.push(type); localStorage.setItem('bk_endings', JSON.stringify(f)); }
  } catch (e){}
}

function renderEnding(type){
  var L = lang, E = ENDINGS[type];
  var rows = [
    [I18N[L].sFood, stats.food, 'food-fill'],
    [I18N[L].sSafety, stats.safety, 'safety-fill'],
    [I18N[L].sConv, stats.convenience, 'conv-fill'],
    [I18N[L].sComfort, stats.comfort, 'comfort-fill'],
    [I18N[L].sMeaning, stats.meaning, 'meaning-fill'],
    [I18N[L].sCrisis, stats.crisis, 'crisis-fill'],
    [I18N[L].sBoredom, boredom, 'boredom-fill']
  ];
  var fsHTML = rows.map(function(it){
    var pct = Math.round(it[1]);
    return '<div class="fs-row"><span class="fs-label">' + it[0] +
      '</span><div class="fs-bar"><div class="fs-fill ' + it[2] +
      '" data-pct="' + pct + '" style="width:0"></div></div><span class="fs-val">' + pct + '%</span></div>';
  }).join('');
  var found = getFoundEndings();
  var order = ['ruin','stagnation','boredom','harmony'];
  var dots = order.map(function(k){
    return '<span class="dot' + (found.indexOf(k) >= 0 ? ' found' : '') + '"></span>';
  }).join('');
  $('ending-inner').innerHTML =
    '<div class="end-badge">' + E.name[L] + '</div>' +
    '<h1>' + E.title[L] + '</h1>' +
    '<p class="end-sub">' + E.sub[L] + '</p>' +
    '<div id="final-stats">' + fsHTML + '</div>' +
    '<p class="end-reflect">' + E.reflect[L] + '</p>' +
    '<div class="end-tracker">' + I18N[L].endTracker + ' ' + found.length + ' / 4 &nbsp; ' + dots + '</div>' +
    '<button class="overlay-btn end-btn" id="btn-restart">' + I18N[L].endRestart + '</button>';
  $('btn-restart').addEventListener('click', restart);
}

function fillFinalStats(){
  var fills = document.querySelectorAll('#ending .fs-fill');
  for (var i = 0; i < fills.length; i++){
    fills[i].style.width = fills[i].getAttribute('data-pct') + '%';
  }
}

function showEnding(type){
  phase = 'ended';
  endingType = type;
  recordEnding(type);
  renderEnding(type);
  var el = $('ending');
  el.className = 'overlay hidden ' + ENDINGS[type].cls;
  setTimeout(function(){
    el.classList.remove('hidden');
    el.classList.add('show');
    setTimeout(fillFinalStats, 1300);
  }, 50);
}

function updateIntroTracker(){
  var f = getFoundEndings();
  var el = $('intro-tracker');
  if (f.length > 0){
    el.textContent = I18N[lang].endTracker + ' ' + f.length + ' / 4';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function resetSim(){
  stats = freshStats();
  boredom = 0;
  year = 0;
  era = -1;
  speedIdx = 1;
  phase = 'intro';
  nextEvent = 0;
  endingType = null;
  particles = [];
  $('speed-label').textContent = '1x';
  $('btn-pause').textContent = '⏸';
  $('choice').classList.remove('show');
  updateUI(0);
  updateIntroTracker();
  render();
}

function restart(){
  $('ending').classList.remove('show');
  $('ending').classList.add('hidden');
  resetSim();
  $('intro').classList.remove('hidden');
}

function startGame(){
  $('intro').classList.add('hidden');
  resizeCanvas();
  particles = [];
  for (var i = 0; i < 20; i++) particles.push(spawnParticle());
  phase = 'playing';
  lastTick = performance.now();
  render();
}

$('btn-start').addEventListener('click', startGame);
$('btn-reset').addEventListener('click', restart);

$('choice').addEventListener('click', function(ev){
  var btn = ev.target.closest ? ev.target.closest('.opt-btn') : null;
  if (btn) pickOption(parseInt(btn.getAttribute('data-opt'), 10));
});

$('btn-pause').addEventListener('click', function(){
  if (phase === 'playing'){ phase = 'paused'; this.textContent = '▶'; }
  else if (phase === 'paused'){ phase = 'playing'; lastTick = performance.now(); this.textContent = '⏸'; }
});

$('btn-faster').addEventListener('click', function(){
  speedIdx = Math.min(speedIdx + 1, SPEEDS.length - 1);
  $('speed-label').textContent = SPEEDS[speedIdx] + 'x';
});

$('btn-slower').addEventListener('click', function(){
  speedIdx = Math.max(speedIdx - 1, 0);
  $('speed-label').textContent = SPEEDS[speedIdx] + 'x';
});

function applyLang(l){
  lang = l;
  var btns = document.querySelectorAll('.lang-btn');
  for (var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('active', btns[i].dataset.lang === l);
  }
  var els = document.querySelectorAll('[data-i18n]');
  for (var j = 0; j < els.length; j++){
    var key = els[j].getAttribute('data-i18n');
    if (I18N[l][key]) els[j].innerHTML = I18N[l][key];
  }
  var yy = Math.floor(year);
  $('year-display').textContent = l === 'ja' ? yy.toLocaleString() + ' 年' : 'Year ' + yy.toLocaleString();
  if (phase === 'choice') renderChoice(currentEvent);
  if (phase === 'ended' && endingType){ renderEnding(endingType); fillFinalStats(); }
  updateIntroTracker();
}

var langBtns = document.querySelectorAll('.lang-btn');
for (var li = 0; li < langBtns.length; li++){
  langBtns[li].addEventListener('click', function(){ applyLang(this.dataset.lang); });
}

resizeCanvas();
era = -1;
updateUI(0);
updateIntroTracker();
render();
setInterval(tick, 16);

})();
</script>
</body>
</html>
